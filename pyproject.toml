[project]
name = "persona-configurable-financial-agent"
version = "0.1.0"
description = "A persona-configurable, MCP-grounded financial analysis agent."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "fastmcp>=2,<3",
    "langgraph>=0.2,<1",
    "mistralai>=1,<2",
    "pydantic>=2.9,<3",
    "python-dotenv>=1,<2",
    "rapidfuzz>=3,<4",
    "streamlit>=1.39,<2",
    "tenacity>=9,<10",
    "google-genai>=1,<2",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.29,<1",
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
